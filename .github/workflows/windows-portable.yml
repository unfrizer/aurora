name: Portable Windows

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --frozen --dev --group build --python 3.13
      - run: uv run --frozen --group build python -m scripts.build_windows_bundle
      - name: Check portable ZIP
        shell: pwsh
        run: |
          $path = 'build/portable/AURORA-Windows-x64.zip'
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw 'Missing portable ZIP' }
          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $path).Path)
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName })
            if ($names -notcontains 'AURORA/AURORA.exe') { throw 'Missing packaged executable' }
            if ($names -notcontains 'AURORA/_internal/frontend/dist/index.html') { throw 'Missing packaged UI' }
            if (-not @($names | Where-Object { $_ -like 'AURORA/_internal/frontend/dist/assets/*' }).Count) { throw 'Missing packaged UI assets' }
            foreach ($name in $names) {
              if (-not $name.StartsWith('AURORA/')) { throw 'Unexpected ZIP root' }
              if ($name.Contains('..') -or $name.Contains('\')) { throw 'Unsafe ZIP path' }
              if ($name -match '(^|/)(state\.json|aurora\.project\.json|settings\.json|\.env|\.git)(/|$)') { throw 'Private file in ZIP' }
            }
          } finally {
            $archive.Dispose()
          }
      - name: Smoke packaged application
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'aurora-portable-smoke'
          New-Item -ItemType Directory -Path $smoke -ErrorAction Stop | Out-Null
          Expand-Archive -LiteralPath 'build/portable/AURORA-Windows-x64.zip' -DestinationPath $smoke
          $profile = Join-Path $smoke 'profile'
          $localAppData = Join-Path $smoke 'localappdata'
          New-Item -ItemType Directory -Path $profile, $localAppData | Out-Null
          $noBrowser = Join-Path $smoke 'no-browser.cmd'
          Set-Content -LiteralPath $noBrowser -Encoding ascii -Value '@echo off', 'exit /b 0'
          $env:USERPROFILE = $profile
          $env:LOCALAPPDATA = $localAppData
          $env:BROWSER = $noBrowser
          $exe = Join-Path $smoke 'AURORA/AURORA.exe'
          function Wait-AuroraOrigin([System.Diagnostics.Process]$appProcess) {
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              Start-Sleep -Milliseconds 250
              if ($appProcess.HasExited) { throw "Packaged AURORA exited with $($appProcess.ExitCode)" }
              $ids = @($appProcess.Id)
              $ids += @(Get-CimInstance Win32_Process -Filter "ParentProcessId = $($appProcess.Id)" | ForEach-Object { [int]$_.ProcessId })
              $listeners = Get-NetTCPConnection -State Listen -LocalAddress '127.0.0.1' | Where-Object { $ids -contains $_.OwningProcess }
              foreach ($listener in $listeners) {
                $candidate = "http://127.0.0.1:$($listener.LocalPort)"
                try {
                  $health = Invoke-RestMethod -Uri "$candidate/api/v1/health" -TimeoutSec 1
                  if ($health.status -eq 'ok') { return $candidate }
                } catch { }
              }
            }
            throw 'Packaged health endpoint did not become ready'
          }
          function Stop-AuroraProcess([System.Diagnostics.Process]$appProcess) {
            $children = Get-CimInstance Win32_Process -Filter "ParentProcessId = $($appProcess.Id)" -ErrorAction SilentlyContinue
            foreach ($child in $children) { Stop-Process -Id $child.ProcessId -Force -ErrorAction SilentlyContinue }
            Stop-Process -Id $appProcess.Id -Force -ErrorAction SilentlyContinue
            if (-not $appProcess.WaitForExit(10000)) { throw 'Packaged AURORA did not stop' }
          }
          $process = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          try {
            $origin = Wait-AuroraOrigin $process
            $index = Invoke-WebRequest -Uri $origin -TimeoutSec 3
            if ($index.StatusCode -ne 200 -or $index.Content -notmatch '<div id="root"></div>') {
              throw 'Packaged UI did not load'
            }
            $projectRoot = Join-Path $profile 'Documents/AURORA/Projects'
            if (Test-Path -LiteralPath $projectRoot) {
              throw 'Smoke launch unexpectedly created project data'
            }
            $headers = @{ Origin = $origin; 'X-Aurora-Request' = '1' }
            $createdResponse = Invoke-WebRequest -Uri "$origin/api/v1/projects" -Method Post -Headers $headers -ContentType 'application/json' -Body '{"name":"Packaged Smoke"}'
            $created = $createdResponse.Content | ConvertFrom-Json
            if (-not $created.metadata.project_id -or $created.metadata.name -ne 'Packaged Smoke') {
              throw 'Packaged project creation failed'
            }
            $projectId = [string]$created.metadata.project_id
            $createdJson = [System.Text.Json.JsonDocument]::Parse($createdResponse.Content)
            try {
              $expectedUpdatedAt = $createdJson.RootElement.GetProperty('metadata').GetProperty('updated_at').GetString()
            } finally {
              $createdJson.Dispose()
            }
            $body = @{
              name = 'Packaged Smoke'
              state = @{ smoke = @{ portable_reopen = 'verified' } }
              expected_updated_at = $expectedUpdatedAt
            } | ConvertTo-Json -Depth 5 -Compress
            $saved = Invoke-RestMethod -Uri "$origin/api/v1/projects/$projectId" -Method Put -Headers $headers -ContentType 'application/json' -Body $body
            if ($saved.metadata.project_id -ne $projectId -or $saved.state.smoke.portable_reopen -ne 'verified') {
              throw 'Packaged project save failed'
            }
            if (-not (Test-Path -LiteralPath $projectRoot -PathType Container)) {
              throw 'Packaged project was not written to the isolated profile'
            }
            Stop-AuroraProcess $process
            $process = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
            $origin = Wait-AuroraOrigin $process
            $reopened = Invoke-RestMethod -Uri "$origin/api/v1/projects/$projectId" -TimeoutSec 3
            if ($reopened.metadata.project_id -ne $projectId -or $reopened.metadata.name -ne 'Packaged Smoke' -or $reopened.state.smoke.portable_reopen -ne 'verified') {
              throw 'Packaged project did not reopen after process restart'
            }
          } finally {
            Stop-AuroraProcess $process
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AURORA-Windows-x64
          path: build/portable/AURORA-Windows-x64.zip
          if-no-files-found: error
