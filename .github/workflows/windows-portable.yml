name: Portable Windows

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --frozen --dev --group build --python 3.13
      - run: uv run --frozen --group build python -m scripts.build_windows_bundle
      - name: Check portable ZIP
        shell: pwsh
        run: |
          $path = 'build/portable/AURORA-Windows-x64.zip'
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw 'Missing portable ZIP' }
          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $path).Path)
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName })
            if ($names -notcontains 'AURORA/AURORA.exe') { throw 'Missing packaged executable' }
            if ($names -notcontains 'AURORA/_internal/frontend/dist/index.html') { throw 'Missing packaged UI' }
            if (-not @($names | Where-Object { $_ -like 'AURORA/_internal/frontend/dist/assets/*' }).Count) { throw 'Missing packaged UI assets' }
            foreach ($name in $names) {
              if (-not $name.StartsWith('AURORA/')) { throw 'Unexpected ZIP root' }
              if ($name.Contains('..') -or $name.Contains('\')) { throw 'Unsafe ZIP path' }
              if ($name -match '(^|/)(state\.json|aurora\.project\.json|settings\.json|\.env|\.git)(/|$)') { throw 'Private file in ZIP' }
            }
          } finally {
            $archive.Dispose()
          }
      - name: Smoke packaged application
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'aurora-portable-smoke'
          New-Item -ItemType Directory -Path $smoke -ErrorAction Stop | Out-Null
          Expand-Archive -LiteralPath 'build/portable/AURORA-Windows-x64.zip' -DestinationPath $smoke
          $profile = Join-Path $smoke 'profile'
          $localAppData = Join-Path $smoke 'localappdata'
          New-Item -ItemType Directory -Path $profile, $localAppData | Out-Null
          $noBrowser = Join-Path $smoke 'no-browser.cmd'
          Set-Content -LiteralPath $noBrowser -Encoding ascii -Value '@echo off', 'exit /b 0'
          $runnerProfile = $env:USERPROFILE
          $env:USERPROFILE = $profile
          $env:LOCALAPPDATA = $localAppData
          $env:BROWSER = $noBrowser
          $exe = Join-Path $smoke 'AURORA/AURORA.exe'
          function Wait-AuroraOrigin([System.Diagnostics.Process]$appProcess) {
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              Start-Sleep -Milliseconds 250
              if ($appProcess.HasExited) { throw "Packaged AURORA exited with $($appProcess.ExitCode)" }
              $ids = @($appProcess.Id)
              $ids += @(Get-CimInstance Win32_Process -Filter "ParentProcessId = $($appProcess.Id)" -ErrorAction SilentlyContinue | ForEach-Object { [int]$_.ProcessId })
              $listeners = Get-NetTCPConnection -State Listen -LocalAddress '127.0.0.1' -ErrorAction SilentlyContinue | Where-Object { $ids -contains $_.OwningProcess }
              foreach ($listener in $listeners) {
                $candidate = "http://127.0.0.1:$($listener.LocalPort)"
                try {
                  $health = Invoke-RestMethod -Uri "$candidate/api/v1/health" -TimeoutSec 1
                  if ($health.status -eq 'ok') { return $candidate }
                } catch { }
              }
            }
            throw 'Packaged health endpoint did not become ready'
          }
          function Stop-AuroraProcess([System.Diagnostics.Process]$appProcess) {
            $children = Get-CimInstance Win32_Process -Filter "ParentProcessId = $($appProcess.Id)" -ErrorAction SilentlyContinue
            foreach ($child in $children) { Stop-Process -Id $child.ProcessId -Force -ErrorAction SilentlyContinue }
            Stop-Process -Id $appProcess.Id -Force -ErrorAction SilentlyContinue
            if (-not $appProcess.WaitForExit(10000)) { throw 'Packaged AURORA did not stop' }
          }
          $process = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          try {
            $origin = Wait-AuroraOrigin $process
            $index = Invoke-WebRequest -Uri $origin -TimeoutSec 3
            if ($index.StatusCode -ne 200 -or $index.Content -notmatch '<div id="root"></div>') {
              throw 'Packaged UI did not load'
            }
            $projectRoot = Join-Path $profile 'Documents/AURORA/Projects'
            if (Test-Path -LiteralPath $projectRoot) {
              throw 'Smoke launch unexpectedly created project data'
            }
            $headers = @{ Origin = $origin; 'X-Aurora-Request' = '1' }
            $createdResponse = Invoke-WebRequest -Uri "$origin/api/v1/projects" -Method Post -Headers $headers -ContentType 'application/json' -Body '{"name":"Packaged Smoke"}'
            $created = $createdResponse.Content | ConvertFrom-Json
            if (-not $created.metadata.project_id -or $created.metadata.name -ne 'Packaged Smoke') {
              throw 'Packaged project creation failed'
            }
            $projectId = [string]$created.metadata.project_id
            $createdJson = [System.Text.Json.JsonDocument]::Parse($createdResponse.Content)
            try {
              $expectedUpdatedAt = $createdJson.RootElement.GetProperty('metadata').GetProperty('updated_at').GetString()
            } finally {
              $createdJson.Dispose()
            }
            $body = @{
              name = 'Packaged Smoke'
              state = @{ smoke = @{ portable_reopen = 'verified' } }
              expected_updated_at = $expectedUpdatedAt
            } | ConvertTo-Json -Depth 5 -Compress
            $saved = Invoke-RestMethod -Uri "$origin/api/v1/projects/$projectId" -Method Put -Headers $headers -ContentType 'application/json' -Body $body
            if ($saved.metadata.project_id -ne $projectId -or $saved.state.smoke.portable_reopen -ne 'verified') {
              throw 'Packaged project save failed'
            }
            if (-not (Test-Path -LiteralPath $projectRoot -PathType Container)) {
              throw 'Packaged project was not written to the isolated profile'
            }
            Stop-AuroraProcess $process
            $process = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
            $origin = Wait-AuroraOrigin $process
            $reopened = Invoke-RestMethod -Uri "$origin/api/v1/projects/$projectId" -TimeoutSec 3
            if ($reopened.metadata.project_id -ne $projectId -or $reopened.metadata.name -ne 'Packaged Smoke' -or $reopened.state.smoke.portable_reopen -ne 'verified') {
              throw 'Packaged project did not reopen after process restart'
            }
            $env:AURORA_PORTABLE_ORIGIN = $origin
            $env:AURORA_PORTABLE_PROJECTS_ROOT = $projectRoot
            $browserTemp = Join-Path $smoke 'browser-temp'
            New-Item -ItemType Directory -Path $browserTemp -ErrorAction Stop | Out-Null
            $env:TEMP = $browserTemp
            $env:TMP = $browserTemp
            # Chrome rejects a redirected USERPROFILE even with Playwright's unique user-data-dir.
            # The hosted runner profile is disposable; the EXE keeps its isolated launch environment.
            $env:USERPROFILE = $runnerProfile
            Push-Location frontend
            try {
              pnpm exec playwright test e2e/portable-journey.spec.ts
              if ($LASTEXITCODE -ne 0) { throw 'Packaged browser journey failed' }
              pnpm exec playwright test e2e/portable-import-photos.spec.ts
              if ($LASTEXITCODE -ne 0) { throw 'Packaged import/photo browser journey failed' }
              pnpm exec playwright test e2e/portable-paste-import.spec.ts
              if ($LASTEXITCODE -ne 0) { throw 'Packaged paste-import browser journey failed' }
              pnpm exec playwright test e2e/portable-paste-photo-export.spec.ts
              if ($LASTEXITCODE -ne 0) { throw 'Packaged paste/photo/export browser journey failed' }
              pnpm exec playwright test e2e/portable-offline-brief.spec.ts
              if ($LASTEXITCODE -ne 0) { throw 'Packaged offline brief browser journey failed' }
            } finally {
              Pop-Location
              $env:USERPROFILE = $profile
            }
            $expectedText = 'Текст из проверенной portable-сборки.'
            $edited = Invoke-RestMethod -Uri "$origin/api/v1/projects/$projectId" -TimeoutSec 3
            $preferences = Invoke-RestMethod -Uri "$origin/api/v1/preferences" -TimeoutSec 3
            if ($edited.metadata.project_id -ne $projectId -or
                $edited.state.editor.pages[0].sections[0].body -ne $expectedText) {
              throw 'Packaged browser edit was not persisted before process restart'
            }
            if ($preferences.preferences.language -ne 'ru' -or
                $preferences.preferences.onboarding_completed -ne $true) {
              throw 'Packaged browser preferences were not persisted before process restart'
            }
            $allProjects = Invoke-RestMethod -Uri "$origin/api/v1/projects" -TimeoutSec 3
            $importedMatches = @($allProjects | Where-Object { $_.name -eq 'Portable Customer Import' })
            if ($importedMatches.Count -ne 1) { throw 'Expected exactly one packaged imported project' }
            $importedId = [string]$importedMatches[0].project_id
            $imported = Invoke-RestMethod -Uri "$origin/api/v1/projects/$importedId" -TimeoutSec 3
            $importedLogo = [string]$imported.state.editor.brand.logo_path
            $importedImage = [string]$imported.state.editor.pages[0].sections[0].image_path
            if ($imported.state.editor.pages[0].sections[0].body -ne 'Сайт из локального JSON' -or
                $imported.state.editor.pages[0].sections[0].image_alt -ne 'Фото работ клиента' -or
                $importedLogo -notmatch '^assets/[a-f0-9]{64}\.png$' -or
                $importedImage -notmatch '^assets/[a-f0-9]{64}\.png$') {
              throw 'Packaged imported project was not persisted before process restart'
            }
            $pastedMatches = @($allProjects | Where-Object { $_.name -eq 'Portable Pasted Import' })
            if ($pastedMatches.Count -ne 1) { throw 'Expected exactly one packaged pasted project' }
            $pastedId = [string]$pastedMatches[0].project_id
            $pasted = Invoke-RestMethod -Uri "$origin/api/v1/projects/$pastedId" -TimeoutSec 3
            if ($pasted.metadata.project_id -ne $pastedId -or
                $pasted.state.editor.brand.name -ne 'Портативная студия' -or
                $pasted.state.editor.pages[0].sections[0].body -ne 'Сайт из вставленного JSON') {
              throw 'Packaged pasted project was not persisted before process restart'
            }
            $exportedMatches = @($allProjects | Where-Object { $_.name -eq 'Portable Pasted Export' })
            if ($exportedMatches.Count -ne 1) { throw 'Expected exactly one packaged pasted export project' }
            $exportedId = [string]$exportedMatches[0].project_id
            $exported = Invoke-RestMethod -Uri "$origin/api/v1/projects/$exportedId" -TimeoutSec 3
            $exportedImage = [string]$exported.state.editor.pages[0].sections[0].image_path
            if ($exported.metadata.project_id -ne $exportedId -or
                $exported.state.editor.brand.name -ne 'Мастерская для ZIP' -or
                $exported.state.editor.pages[0].sections[0].body -ne 'Сайт из portable JSON' -or
                $exported.state.editor.pages[0].sections[0].image_alt -ne 'Фото работы клиента' -or
                $exportedImage -notmatch '^assets/[a-f0-9]{64}\.png$') {
              throw 'Packaged pasted export project was not persisted before process restart'
            }
            $briefMatches = @($allProjects | Where-Object { $_.name -eq 'Portable Brief Starter' })
            if ($briefMatches.Count -ne 1) { throw 'Expected exactly one packaged offline brief project' }
            $briefId = [string]$briefMatches[0].project_id
            $expectedBrief = "  Настройка велосипедов`nРемонт и диагностика  "
            $briefProject = Invoke-RestMethod -Uri "$origin/api/v1/projects/$briefId" -TimeoutSec 3
            if ($briefProject.metadata.project_id -ne $briefId -or
                $briefProject.state.editor.brand.name -ne 'Portable Brief Starter' -or
                $briefProject.state.editor.pages[0].sections[0].body -cne $expectedBrief) {
              throw 'Packaged offline brief was not persisted before process restart'
            }
            Stop-AuroraProcess $process
            $process = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
            $origin = Wait-AuroraOrigin $process
            $restartedEdit = Invoke-RestMethod -Uri "$origin/api/v1/projects/$projectId" -TimeoutSec 3
            $restartedPreferences = Invoke-RestMethod -Uri "$origin/api/v1/preferences" -TimeoutSec 3
            if ($restartedEdit.metadata.project_id -ne $projectId -or
                $restartedEdit.state.editor.pages[0].sections[0].body -ne $expectedText) {
              throw 'Packaged browser edit did not survive process restart'
            }
            if ($restartedPreferences.preferences.language -ne 'ru' -or
                $restartedPreferences.preferences.onboarding_completed -ne $true) {
              throw 'Packaged browser preferences did not survive process restart'
            }
            $restartedImport = Invoke-RestMethod -Uri "$origin/api/v1/projects/$importedId" -TimeoutSec 3
            if ($restartedImport.metadata.project_id -ne $importedId -or
                $restartedImport.state.editor.pages[0].sections[0].body -ne 'Сайт из локального JSON' -or
                $restartedImport.state.editor.pages[0].sections[0].image_alt -ne 'Фото работ клиента' -or
                $restartedImport.state.editor.brand.logo_path -ne $importedLogo -or
                $restartedImport.state.editor.pages[0].sections[0].image_path -ne $importedImage) {
              throw 'Packaged imported project did not survive process restart'
            }
            $restartedPaste = Invoke-RestMethod -Uri "$origin/api/v1/projects/$pastedId" -TimeoutSec 3
            if ($restartedPaste.metadata.project_id -ne $pastedId -or
                $restartedPaste.state.editor.brand.name -ne 'Портативная студия' -or
                $restartedPaste.state.editor.pages[0].sections[0].body -ne 'Сайт из вставленного JSON') {
              throw 'Packaged pasted project did not survive process restart'
            }
            $restartedExport = Invoke-RestMethod -Uri "$origin/api/v1/projects/$exportedId" -TimeoutSec 3
            if ($restartedExport.metadata.project_id -ne $exportedId -or
                $restartedExport.state.editor.brand.name -ne 'Мастерская для ZIP' -or
                $restartedExport.state.editor.pages[0].sections[0].body -ne 'Сайт из portable JSON' -or
                $restartedExport.state.editor.pages[0].sections[0].image_path -ne $exportedImage) {
              throw 'Packaged pasted export project did not survive process restart'
            }
            $restartedBrief = Invoke-RestMethod -Uri "$origin/api/v1/projects/$briefId" -TimeoutSec 3
            if ($restartedBrief.metadata.project_id -ne $briefId -or
                $restartedBrief.state.editor.brand.name -ne 'Portable Brief Starter' -or
                $restartedBrief.state.editor.pages[0].sections[0].body -cne $expectedBrief) {
              throw 'Packaged offline brief did not survive process restart'
            }
          } finally {
            Stop-AuroraProcess $process
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AURORA-Windows-x64
          path: build/portable/AURORA-Windows-x64.zip
          if-no-files-found: error
